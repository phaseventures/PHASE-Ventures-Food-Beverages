  const pend=act?z.all.map(q=>q.i.done?`<div class="line dn"><div class="row">${nmh(q)}<span class="pr"><span class="mut">${dur(q.i.done-q.i.s)}</span><span class="gbtn">Ready</span></span></div></div>`:`<div class="line"><div class="row">${nmh(q)}<span class="pr">${tmr(q.i.s)}<button class="p" onclick="ready(${z.o.id},${q.x})">Ready</button></span></div></div>`).join(""):"";
  const dn=V.fin?z.dn.map(q=>`<div class="line dn"><div class="row">${nmh(q)}<span class="mut">took ${dur(q.i.done-q.i.s)} - done ${tm(q.i.done)}</span></div></div>`).join(""):"";
  return `<div class="card tk ${first?"first":""} ${allr?"rdy":""}">${first?`<em class="qf">START FIRST</em>`:""}<div class="row"><span class="qh">${V.fin?"":`<i class="qn">${ix+1}</i>`}<b style="font-size:18px">${lab(z.o)}</b></span>${V.fin?`<span class="mut">${tm(z.t0)}</span>`:allr?`<span class="tm ok">ALL READY</span>`:tmr(z.tp)}</div>
  ${pend}${dn}</div>`}).join("");
 const vd=!V.fin?S.orders.flatMap(o=>o.items.filter(i=>i.st===s&&i.v&&i.s&&!i.done&&Date.now()-i.vt<600000).map(i=>`<div class="card" style="border-color:var(--bad);color:var(--bad)">VOIDED: ${i.q}x ${i.n} (${lab(o)})</div>`)).join(""):"";
 return `<div class="pg">`+head(STN[s],tabs)+`<div class="wrap"><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${vd}${cards}</div>${cards||vd?"":`<div class="mut" style="padding:30px;text-align:center">${V.fin?"Nothing finished yet.":"No active tickets. New orders appear here when the counter sends them."}</div>`}</div></div>`}
function serve(){const now=Date.now();
 const os=S.orders.filter(o=>o.status==="open"||o.status==="paid").map(o=>{const it=live(o).map((i,x)=>({i,x})).filter(z=>z.i.s&&!z.i.sv),miss=it.filter(z=>!z.i.done),dn=it.filter(z=>z.i.done);
  return{o,it,miss,dn,t:miss.length?Math.min(...miss.map(z=>z.i.s)):Math.max(0,...dn.map(z=>+z.i.done||0))}})
  .filter(z=>z.it.length&&(z.miss.length||now-z.t<10800000));
 os.sort((a,b)=>(!!a.miss.length===!!b.miss.length)?(a.miss.length?a.t-b.t:b.t-a.t):(a.miss.length?-1:1));
 const cards=os.map(z=>{const p=z.miss.length,sum=z.miss.reduce((a,q)=>a+q.i.q,0),tot=z.it.reduce((a,q)=>a+q.i.q,0);
  return `<div class="card tk ${p?"":"rdy"}"><div class="row"><b style="font-size:16px">${esc(lab(z.o))}</b>${p?tmr(z.t):`<span class="tag rd">ALL READY</span>`}</div>
 <div class="mut" style="margin:2px 0 6px;font-size:12px">${tot-sum}/${tot} ready</div>
 ${p?`<div class="sm"><b>Still missing:</b> ${z.miss.map(q=>q.i.q+"x "+esc(q.i.n)).join(", ")}</div>`:""}
 ${z.it.map(q=>`<div class="line"><div class="row"><span style="font-size:14px"><b>${q.i.q}x</b> ${esc(q.i.n)}${q.i.nt?`<span class="inote" style="display:block">&#9998; ${esc(q.i.nt)}</span>`:""}</span><span class="tag ${q.i.done?"rd":"pr2"}">${q.i.done?"Ready":({app:"Appetizer",main:"Kitchen",bar:"Bar"}[q.i.st]||"Preparing")}</span></div></div>`).join("")}
 ${z.dn.length?`<button class="p" style="width:100%;margin-top:8px" onclick="served(${z.o.id})">Served</button>`:""}</div>`}).join("");
 return `<div class="pg">`+head("Serve","")+`<div class="wrap"><div class="grid sr" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${cards}</div>${cards?"":`<div class="mut" style="padding:30px;text-align:center">Nothing being prepared right now.</div>`}</div></div>`}
function served(oid){const o=ord(oid);if(!o)return;o.items.forEach(i=>{if(i.s&&i.done&&!i.v&&!i.sv)i.sv=Date.now()});save();render()}
function ready(oid,x){ord(oid).items[x].done=Date.now();save();render();setTimeout(render,KGRACE+200)}
setInterval(()=>{if(SB_ON){sbPull(false);return}
 if(V.auth&&(V.role==="kitchen"||V.role==="bar"||V.role==="serve"||V.role==="display")&&!V.modal){try{const x=localStorage.getItem(KEY());if(x&&x!==JSON.stringify(S)){S=JSON.parse(x);render()}}catch(e){}}},2000);
setInterval(()=>{if(V.auth&&(V.role==="kitchen"||V.role==="bar")&&!V.fin&&document.querySelector(".tk.rdy"))render();document.querySelectorAll("[data-t]").forEach(e=>{const t=+e.dataset.t;e.textContent=tfmt(t);e.classList.remove("ok","wn","bd");e.classList.add(tcl(t))});document.querySelectorAll("[data-sw]").forEach(e=>e.textContent=swf(+e.dataset.sw))},5000);
$("hl").innerHTML=LOGO();render();
</script></body></html>
