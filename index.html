  const dl=Array.from({length:n},(_,i)=>i+1),hl=Array.from({length:16},(_,i)=>(i+8)+"h"),ok=Object.keys(oc),hm=ms=>Math.floor(ms/36e5)+"h "+Math.round(ms%36e5/6e4)+"m",top=ok.slice().sort((a,b)=>oc[b].ms-oc[a].ms)[0],

 if(rt==="calendar"){const by={};S.orders.filter(o=>o.status==="paid").forEach(o=>{const k=dk(new Date(o.paidAt));(by[k]=by[k]||[]).push(o)});
  const first=new Date(y,mo,1).getDay(),sel=V.sel||dk(new Date());let cells=["Su","Mo","Tu","We","Th","Fr","Sa"].map(x=>`<div class="h">${x}</div>`).join("")+"<div></div>".repeat(first);

function area(sr,lb,fm){const n=lb.length;if(!n)return"";const W=700,H=170,P=14,mx=Math.max(1e-9,...sr.flatMap(s=>s.d)),x=i=>n>1?P+i*(W-2*P)/(n-1):W/2,y=v=>H-v/mx*H,k=Math.ceil(n/12);
