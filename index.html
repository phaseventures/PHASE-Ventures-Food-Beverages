<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHASE POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:transparent;--card:rgba(255,255,255,.07);--tx:#f6eef0;--mut:#b9a0a8;--ac:#d81f2d;--act:#fff;--bd:rgba(255,255,255,.16);--ok:#34d399;--bad:#fb7185;--warn:#fbbf24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:16px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;min-height:44px}
button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:700}
button.d{color:var(--bad);border-color:var(--bad)}button.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.c{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;padding:20px;text-align:center}
.bar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar .sp{flex:1}.bar b{font-size:18px}
.wrap{padding:14px;max-width:1300px;margin:auto}
.split{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:14px;align-items:start}
@media(max-width:760px){.split{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
h2,h3{margin:0 0 10px}.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.line{padding:9px 0;border-bottom:1px dashed var(--bd)}.line.v{opacity:.5;text-decoration:line-through}
.tot{padding-top:10px;font-size:15px}.tot .g{font-size:24px;font-weight:800;color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{text-align:left;padding:14px;min-height:80px}.item b{display:block}
.tb{min-height:96px;text-align:left}.free{border-style:dashed}.occ{border-color:var(--warn);border-width:2px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);margin-left:4px}
.logo{width:120px;height:120px}
input{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);text-align:center;font-size:22px;letter-spacing:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal button{min-height:58px;padding:4px;font-size:12px;text-align:left;line-height:1.3}
.cal .h{text-align:center;font-size:12px;color:var(--mut)}
.mod{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.mod>div{background:var(--card);border-radius:14px;padding:18px;max-width:520px;width:100%;max-height:85vh;overflow:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.stats .card b{font-size:22px;display:block}
.tk{border-left:6px solid var(--ac)}
html{min-height:100%;background:#000 linear-gradient(180deg,#18090d 0%,#000 100%) no-repeat fixed}body{background:transparent;min-height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--bd);background:rgba(24,9,13,.85);backdrop-filter:blur(8px)}
.top b{font-size:20px;letter-spacing:.3px}.top .logo{width:44px;height:44px}.lg{cursor:pointer;display:block}
.c{min-height:calc(100vh - 72px)!important}.mod>div{background:#26101a;border:1px solid var(--bd)}
.bar{background:rgba(24,9,13,.9);backdrop-filter:blur(8px);top:0}
.acts{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:10px}
.ab{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:8px 2px;min-height:62px;border-radius:12px}.ab span{font-size:22px;line-height:1.1}
.ab.hot{box-shadow:0 0 0 2px var(--warn)}.ab.arm{background:var(--warn);color:#241500}
.search input{width:100%;letter-spacing:0;text-align:left;font-size:16px;margin-bottom:10px}.plain{letter-spacing:0!important;text-align:left!important;font-size:16px!important}
.tile{background:#fff;color:#18090d;font-weight:800;font-size:18px;min-height:110px;border:0}.tile:hover{outline:3px solid var(--ac)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(12,4,7,.95);border-top:1px solid var(--bd);z-index:6}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:13px;padding:4px}.nav button span{font-size:20px}.nav button.on{color:#fca5a5}
.meter{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.meter i{display:block;height:100%;background:#ef4444}
.stats .card b{font-size:20px}textarea{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
@media(max-width:760px){.acts{grid-template-columns:repeat(4,1fr)}.top b{font-size:15px}}
button.p,button.on{background:linear-gradient(135deg,#e11d2e,#5a0b14)!important;border-color:transparent!important;color:#fff!important}.nav button.on{background:none!important;color:#fca5a5!important}
.c .logo{width:110px;height:110px;object-fit:contain}.top .logo{width:44px;height:44px;object-fit:contain}
.ti{font-family:"Chakra Petch","Trebuchet MS",sans-serif;font-size:34px;letter-spacing:4px;margin:6px 0 0;text-align:center}
.su{text-align:center;font-size:12px;letter-spacing:4px;color:#6b7280;margin:8px 0 14px}.dv{border:0;border-top:1px solid #1f1f23;margin:0 0 18px}
.lw{width:min(420px,92vw);display:flex;flex-direction:column;align-items:stretch}.lw .logo{align-self:center}
.fl{font-family:"Chakra Petch",sans-serif;font-size:12px;letter-spacing:2px;color:#9ca3af;margin:12px 0 8px}
.in{width:100%;letter-spacing:0!important;text-align:left!important;font-size:16px!important;font-family:Inter,system-ui,sans-serif;background:#0b0b0b;border:1px solid #2a2a2e;border-radius:12px;padding:15px 16px}
.pwb{position:relative}.pwb .eye{position:absolute;right:6px;top:4px;border:0;background:none;color:#9ca3af;font-size:18px}
button.big{width:100%;margin-top:26px;padding:15px;font-family:"Chakra Petch",sans-serif;letter-spacing:3px;font-size:15px}.er{color:var(--bad);min-height:24px;text-align:center;margin-top:12px;font-size:14px}
.sec{display:grid;grid-template-columns:repeat(3,200px);gap:14px;justify-content:center}.sb{width:200px;height:110px;font-size:20px;font-weight:700;text-align:center;justify-content:center}
@media(max-width:700px){.sec,.sec[style]{grid-template-columns:200px!important}}
.floor{position:relative;height:calc(100vh - 290px);min-height:420px;border:1px dashed var(--bd);border-radius:14px;background:rgba(255,255,255,.03)}
.floor.edit{border-color:var(--warn);background-image:radial-gradient(var(--bd) 1px,transparent 1px);background-size:24px 24px}
.ft{position:absolute;width:128px;min-height:84px;border-radius:12px;padding:10px;border:2px solid;cursor:pointer;touch-action:none;user-select:none;font-weight:700}
.ft small{display:block;font-weight:400;opacity:.85;margin-top:4px}.ft.g{background:#0f3d24;border-color:#22c55e}.ft.r{background:#4a1015;border-color:#ef4444}.ft.y{background:#4a3a08;border-color:#fbbf24}.ft.ed{border-style:dashed;cursor:move}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kp button{min-height:56px;font-size:22px}
.kd{font-size:38px;font-weight:800;text-align:center;padding:10px;border:1px solid var(--bd);border-radius:12px;margin:10px 0;min-height:64px}
</style></head><body><div id="app"></div>
<script>
const PASS="PH1S3",CUR="SR ",TAX=0.10;
const MENU=[
{id:1,n:"Spring Rolls",p:6,c:2,st:"app",cat:"Appetizers"},{id:2,n:"Garlic Bread",p:5,c:1.2,st:"app",cat:"Appetizers"},
{id:3,n:"Caesar Salad",p:8,c:2.5,st:"app",cat:"Appetizers"},{id:4,n:"Tomato Soup",p:6,c:1.5,st:"app",cat:"Appetizers"},
{id:5,n:"Grilled Salmon",p:22,c:8,st:"main",cat:"Mains"},{id:6,n:"Ribeye Steak",p:28,c:11,st:"main",cat:"Mains"},
{id:7,n:"Chicken Alfredo",p:16,c:4.5,st:"main",cat:"Mains"},{id:8,n:"Margherita Pizza",p:14,c:3.5,st:"main",cat:"Mains"},
{id:9,n:"Veggie Burger",p:13,c:3.2,st:"main",cat:"Mains"},{id:10,n:"Cola",p:3,c:0.6,st:"bar",cat:"Drinks"},
{id:11,n:"Fresh Orange Juice",p:5,c:1.4,st:"bar",cat:"Drinks"},{id:12,n:"Iced Tea",p:4,c:0.5,st:"bar",cat:"Drinks"},
{id:13,n:"Coffee",p:3.5,c:0.4,st:"bar",cat:"Drinks"},{id:14,n:"Mocktail",p:7,c:1.8,st:"bar",cat:"Drinks"}];
const STN={app:"Appetizer Kitchen",main:"Main Kitchen",bar:"Bar"};
const fresh=()=>({tables:[1,2,3,4,5,6,7,8].map((n,i)=>({n:""+n,name:"",seats:4,x:6+(i%4)*24,y:8+Math.floor(i/4)*34})),orders:[],seq:1,name:"PHASE Ventures | Food & Beverages",exp:[],house:[]});
let S=fresh();
const KEY=()=>"dpos_"+(V.user||"x");
function loadS(){S=fresh();try{const x=localStorage.getItem(KEY());if(x)S=JSON.parse(x)}catch(e){}S.tables.forEach((t,i)=>{if(t.x==null){t.x=6+(i%4)*24;t.y=8+Math.floor(i/4)*34}});S.exp=S.exp||[];S.house=S.house||[]}
const save=()=>{try{localStorage.setItem(KEY(),JSON.stringify(S))}catch(e){}};
const USERS=["resto1","resto2"];
const tname=n=>{const t=S.tables.find(z=>z.n===n);return t&&t.name?t.name:"Table "+n};
let V={auth:false,splash:true,role:null,stn:null,tab:"home",user:null,edit:false,kp:"",pm:"Cash",oid:null,cat:null,q:"",rt:"summary",armed:0,fin:false,modal:null,cal:new Date(),sel:null,bad:false};
const $=s=>document.getElementById(s),m=v=>CUR+(+v).toFixed(2);
const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const tm=t=>new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
const ord=id=>S.orders.find(o=>o.id===id);
const lab=o=>o.takeout?"Takeout #"+o.id:o.tables.map(tname).join(" + ");
const live=o=>o.items.filter(i=>!i.v);
const calc=o=>{const l=live(o),g=l.reduce((a,i)=>a+i.p*i.q,0),sub=g*(1-(o.disc||0)/100),cost=l.reduce((a,i)=>a+i.c*i.q,0),tax=sub*TAX,
 vd=o.items.filter(i=>i.v).reduce((a,i)=>a+i.p*i.q,0);return{g,sub,cost,tax,total:sub+tax,vd}};
const openFor=t=>S.orders.find(o=>o.status==="open"&&o.tables.includes(t));
function go(p){Object.assign(V,p);render()}
function LOGO(){return `<img class="logo" src="PHASE-LOGO.PNG" alt="PHASE" onerror="this.style.display='none'">`}
function render(){render0();if(!V.splash){const a=$("app");a.innerHTML=hdr()+a.innerHTML}}
function render0(){
 const a=$("app");
 if(V.splash){a.innerHTML=`<div class="c">${LOGO()}<h1 class="ti">PHASE VENTURES</h1></div>`;setTimeout(()=>{V.splash=false;render()},1600);return}
 if(!V.auth){a.innerHTML=`<div class="c"><div class="lw">${LOGO()}<h1 class="ti">PHASE VENTURES</h1><div class="su">ENTER PASSWORD TO CONTINUE</div><hr class="dv">
 <label class="fl">NAME</label><input class="in" id="un" placeholder="Enter name" autocomplete="off" autocapitalize="off">
 <label class="fl">PASSWORD</label><div class="pwb"><input class="in" id="pw" type="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')login()"><button class="eye" onclick="const p=$('pw');p.type=p.type==='password'?'text':'password'">&#128065;</button></div>
 <button class="p big" onclick="login()">ENTER POS</button><div class="er">${V.bad?"Wrong name or password.":""}</div></div></div>`;setTimeout(()=>$("un")&&$("un").focus(),0);return}
 if(!V.role){a.innerHTML=`<div class="c">${LOGO()}<h2>Choose your section</h2><div class="sec">
 <button class="sb" onclick="go({role:'counter',tab:'home',oid:null})">Counter</button><button class="sb" onclick="go({role:'kitchen'})">Kitchen</button><button class="sb" onclick="go({role:'bar',stn:'bar'})">Bar</button></div>
 <button onclick="go({auth:false,user:null})">Lock POS</button></div>`;return}
 if(V.role==="kitchen"&&!V.stn){a.innerHTML=`<div class="c"><h2>Which kitchen?</h2><div class="sec" style="grid-template-columns:repeat(2,200px)">
 <button class="sb" onclick="go({stn:'main'})">Main Kitchen</button><button class="sb" onclick="go({stn:'app'})">Appetizer Kitchen</button></div><button onclick="go({role:null})">Back</button></div>`;return}
 a.innerHTML=(V.role==="counter"?counter():station())+(V.modal?modal():"");
}
function login(){const u=$("un").value.trim().toLowerCase();if(USERS.includes(u)&&$("pw").value===PASS){V.user=u;loadS();go({auth:true,bad:false})}else go({bad:true})}
function head(t,tabs){return `<div class="bar"><span class="tag">${t}</span>${tabs||""}<span class="sp"></span><button onclick="go({role:null,stn:null,oid:null})">Switch section</button></div>`}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hdr(){return `<header class="top">${LOGO()}<b>${esc(S.name)}</b><span style="flex:1"></span>${V.user?`<span class="tag">${esc(V.user)}</span>`:""}</header>`}
function counter(){
 const T=V.tab,o=V.oid?ord(V.oid):null;
 const nav=[["home","Home","⌂"],["orders","Orders","◷"],["tables","Tables","▦"]].map(t=>`<button class="${T===t[0]?"on":""}" onclick="go({tab:'${t[0]}'})"><span>${t[2]}</span>${t[1]}</button>`).join("")+`<button onclick="newOrder([],true)"><span>+</span>New</button>`;
 const body=T==="home"?home(o):T==="orders"?ordersTab():T==="tables"?tablesTab():reports();
 return head("Counter",`<button onclick="go({modal:{t:'more'}})">More</button>`)+`<div class="wrap" style="padding-bottom:100px">${body}</div><nav class="nav">${nav}</nav>`}
function mgrid(){const q=(V.q||"").toLowerCase();
 if(!q&&!V.cat)return [["Mains","MAIN"],["Appetizers","APPETIZER"],["Drinks","DRINKS"]].map(c=>`<button class="tile" onclick="go({cat:'${c[0]}'})">${c[1]}</button>`).join("");
 const l=MENU.filter(i=>q?i.n.toLowerCase().includes(q):i.cat===V.cat);
 return `<button class="tile" onclick="go({cat:null,q:''})">&larr; Categories</button>`+l.map(i=>`<button class="item" onclick="add(${i.id})"><b>${i.n}</b><span class="mut">${m(i.p)}</span></button>`).join("")}
function ab(ic,l,fn,c,dis){return `<button class="ab ${c||""}" ${dis?"disabled":""} onclick="${fn}"><span>${ic}</span>${l}</button>`}
function home(o){
 const unsent=o&&live(o).some(i=>!i.s),armed=Date.now()<V.armed,c=o?calc(o):null;
 const lines=o?o.items.map((i,x)=>`<div class="line ${i.v?"v":""}"><div class="row"><span><b>${i.q}x</b> ${i.n}${i.s?` <span class="tag">${i.done?"served":"sent"}</span>`:""}</span><span>${m(i.p*i.q)}</span></div>
 ${i.v?`<div class="mut">Voided: ${i.vr}</div>`:`<div class="row" style="margin-top:6px;justify-content:flex-start">${i.s?"":`<button onclick="qty(${x},-1)">-</button><button onclick="qty(${x},1)">+</button>`}<button class="d" onclick="go({modal:{t:'void',x:${x}}})">${i.s?"Void":"Remove"}</button></div>`}</div>`).join("")||`<div class="mut" style="padding:24px 0">No items yet. Pick a category and tap a dish.</div>`:"";
 const left=o?`<div class="card"><div class="row"><h3>${esc(lab(o))}</h3><span class="mut">${o.guests?o.guests+" guests":""}</span></div>
 <div class="row" style="justify-content:flex-start;flex-wrap:wrap;margin-bottom:6px">${(o.tags||[]).map(t=>`<span class="tag">${t}</span>`).join("")}${o.takeout?"":`<button onclick="go({modal:{t:'merge'}})">Merge tables</button>`}</div>
 ${o.note?`<div class="mut">Note: ${esc(o.note)}</div>`:""}${lines}
 <div class="tot"><div class="row"><span>Subtotal</span><span>${m(c.g)}</span></div>${o.disc?`<div class="row"><span>Discount (${o.disc}%)</span><span>-${m(c.g-c.sub)}</span></div>`:""}<div class="row"><span>Tax (${TAX*100}%)</span><span>${m(c.tax)}</span></div>
 <div class="row" style="margin-top:6px"><b>Total</b><span class="g">${m(c.total)}</span></div></div>
 <button class="p" style="width:100%;margin-top:12px" ${live(o).length&&!unsent?"":"disabled"} onclick="go({modal:{t:'pay'},kp:'',pm:'Cash'})">Pay</button>
 ${unsent?`<div class="mut" style="margin-top:6px">Press Order twice to send the new items. Then you can pay.</div>`:""}</div>`
 :`<div class="card"><h3>No table selected</h3><div class="mut">Tap Tables, pick a table and enter the number of guests.</div><button class="p" style="margin-top:12px" onclick="go({tab:'tables'})">Tables</button></div>`;
 const n=!o;
 const right=`<div><div class="acts">${ab("🖨","Print","printOrder()","",n||!live(o).length)}${ab("📋",armed?"Tap again":"Order","send()",(unsent?"hot ":"")+(armed?"arm":""),n||!unsent)}${ab("⊘","Void","go({modal:{t:'voidpick'}})","",n)}${ab("%","Discount","go({modal:{t:'disc'}})","",n)}${ab("✎","Notes","go({modal:{t:'note'}})","",n)}${ab("🏷","Tags","go({modal:{t:'tags'}})","",n)}${ab("•••","More","go({modal:{t:'more'}})")}</div>
 <div class="search"><input id="sq" placeholder="Search products" value="${esc(V.q)}" oninput="V.q=this.value;$('mg').innerHTML=mgrid()"></div><div id="mg" class="grid">${mgrid()}</div></div>`;
 return `<div class="split">${left}${right}</div>`}
function printOrder(){const o=ord(V.oid);o.pr=Date.now();save();go({modal:{t:"receipt"}})}
function tablesTab(){
 const T=S.tables.map(t=>{const o=openFor(t.n),k=!o?"g":(o.pr?"y":"r");return `<div class="ft ${k} ${V.edit?"ed":""}" data-n="${t.n}" style="left:${t.x}%;top:${t.y}%" onpointerdown="pd(event,'${t.n}')">${esc(tname(t.n))}<small>${o?o.guests+" guests - "+m(calc(o).total):t.seats+" seats"}</small></div>`}).join("");
 return `<div class="row" style="flex-wrap:wrap;margin-bottom:10px"><h2>Tables</h2><span class="mut"><span style="color:#22c55e">&#9632;</span> Open &nbsp;<span style="color:#ef4444">&#9632;</span> Not paid &nbsp;<span style="color:#fbbf24">&#9632;</span> Receipt printed</span>
 ${V.edit?`<span><button onclick="S.tables.push({n:''+(Math.max(0,...S.tables.map(t=>+t.n||0))+1),name:'',seats:4,x:40,y:40});save();render()">+ Add table</button> <button class="p" onclick="go({edit:false})">Done</button></span>`:`<span class="mut">Hold a table to move or rename it</span>`}</div>
 <div id="floor" class="floor ${V.edit?"edit":""}">${T}</div>`}
let D=null;
function pd(e,n){e.preventDefault();const t=S.tables.find(z=>z.n===n);D={n,t,sx:e.clientX,sy:e.clientY,ox:t.x,oy:t.y,fl:$("floor").getBoundingClientRect(),mv:0,lp:0};
 if(!V.edit)D.timer=setTimeout(()=>{if(D){D.lp=1;V.edit=true;render()}},600)}
document.addEventListener("pointermove",e=>{if(!D)return;const dx=e.clientX-D.sx,dy=e.clientY-D.sy;if(Math.abs(dx)+Math.abs(dy)>6){D.mv=1;clearTimeout(D.timer)}
 if(V.edit&&D.mv){D.t.x=Math.min(86,Math.max(0,D.ox+dx/D.fl.width*100));D.t.y=Math.min(80,Math.max(0,D.oy+dy/D.fl.height*100));const el=document.querySelector(`[data-n="${D.n}"]`);if(el){el.style.left=D.t.x+"%";el.style.top=D.t.y+"%"}}});
document.addEventListener("pointerup",()=>{if(!D)return;clearTimeout(D.timer);const d=D;D=null;if(d.lp)return;if(d.mv){if(V.edit)save();return}
 if(V.edit){go({modal:{t:"tname",n:d.n}});return}
 const o=openFor(d.n);o?go({modal:{t:"topt",n:d.n}}):go({modal:{t:"guest",n:d.n},kp:""})});
function kpad(){return `<div class="kp">${[1,2,3,4,5,6,7,8,9,".",0,"⌫"].map(k=>`<button onclick="kp('${k}')">${k}</button>`).join("")}</div>`}
function kp(k){let s=V.kp||"";const g=V.modal&&V.modal.t==="guest";if(k==="⌫")s=s.slice(0,-1);else if(k==="."){if(g)return;if(!s.includes("."))s=(s||"0")+"."}else s=(s+k).slice(0,g?2:9);V.kp=s;render()}

  const first=new Date(y,mo,1).getDay(),sel=V.sel||dk(new Date());let cells=["Su","Mo","Tu","We","Th","Fr","Sa"].map(x=>`<div class="h">${x}</div>`).join("")+"<div></div>".repeat(first);
  for(let i=1;i<=n;i++){const k=dk(new Date(y,mo,i)),a=by[k]||[];cells+=`<button class="${k===sel?"on":""}" onclick="go({sel:'${k}'})"><b>${i}</b><br>${a.length?m(A(a).rev):""}</button>`}
  const D=A(by[sel]||[]);body=`<div class="split" style="grid-template-columns:1fr 1fr"><div class="card"><div class="cal">${cells}</div></div><div><h3>${sel}</h3><div class="stats">${st("Revenue",m(D.rev))}${st("Net sales",m(D.sub))}${st("Gross income",m(D.sub-D.cogs))}${st("Tax",m(D.tax))}${st("Voided",m(D.vd))}${st("Orders",D.n)}</div></div></div>`}
 if(rt==="ai")body=`<div class="card"><h3>AI analysis of order history</h3><div class="mut" style="margin-bottom:10px">Reads all finished orders: best sellers, peak hours, voids, discounts and pairings, then suggests actions.</div><button class="p" onclick="aiRun()">Analyze order history</button><div id="ai" style="margin-top:14px;white-space:pre-wrap;line-height:1.55">${V.ai?md(V.ai):""}</div></div>`;
 return `<div class="row" style="flex-wrap:wrap"><h2>Reports</h2><button onclick="demo()">Load sample data</button></div><div class="row" style="flex-wrap:wrap;justify-content:flex-start;margin-bottom:10px">${tabs}</div>
 ${rt==="ai"?"":`<div class="row" style="margin-bottom:10px"><button onclick="V.cal=new Date(${y},${mo-1},1);render()">Previous</button><b>${d.toLocaleString([],{month:"long",year:"numeric"})}</b><button onclick="V.cal=new Date(${y},${mo+1},1);render()">Next</button></div>`}${body}`}
function md(t){return esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^#+\s*(.*)$/gm,"<b>$1</b>").replace(/^- /gm,"&bull; ")}
function aiData(){const P=S.orders.filter(o=>o.status==="paid"),it={},hr={},wd={},vr={},pr={},pay={};let ds=0,items=0;
 P.forEach(o=>{const t=new Date(o.paidAt);hr[t.getHours()]=(hr[t.getHours()]||0)+1;const w=t.toLocaleDateString([],{weekday:"short"});wd[w]=(wd[w]||0)+o.total;pay[o.method]=(pay[o.method]||0)+1;if(o.disc)ds++;
  const names=[...new Set(live(o).map(i=>i.n))];live(o).forEach(i=>{const e=it[i.n]||(it[i.n]={q:0,rev:0,margin:+((i.p-i.c)/i.p*100).toFixed(0)});e.q+=i.q;e.rev+=i.p*i.q;items+=i.q});
  o.items.filter(i=>i.v).forEach(i=>vr[i.vr]=(vr[i.vr]||0)+i.q);
  names.forEach((a,x)=>names.slice(x+1).forEach(b=>{const k=[a,b].sort().join(" + ");pr[k]=(pr[k]||0)+1}))});
 MENU.forEach(i=>{if(!it[i.n])it[i.n]={q:0,rev:0,margin:+((i.p-i.c)/i.p*100).toFixed(0)}});
 const L=Object.entries(it).sort((a,b)=>b[1].q-a[1].q);
 return{orders:P.length,revenue:+P.reduce((s,o)=>s+o.total,0).toFixed(2),avgItemsPerOrder:P.length?+(items/P.length).toFixed(1):0,discountedOrders:ds,top:L.slice(0,5),slowest:L.slice(-5),ordersByHour:hr,salesByWeekday:wd,voidReasons:vr,payments:pay,topPairs:Object.entries(pr).sort((a,b)=>b[1]-a[1]).slice(0,5)}}
function localAI(D){const t=D.top[0],s=D.slowest[D.slowest.length-1],h=Object.entries(D.ordersByHour).sort((a,b)=>b[1]-a[1])[0],vt=Object.values(D.voidReasons).reduce((a,b)=>a+b,0);
 return `- **Best seller:** ${t[0]} (${t[1].q} sold). Keep it prominent and never run out.\n- **Slowest item:** ${s[0]} (${s[1].q} sold). Rework, bundle or remove it.\n- **Peak hour:** ${h[0]}:00 with ${h[1]} orders. Staff the kitchen and bar up before then.\n- **Voids:** ${vt} voided items${vt?". Review the top reasons with staff.":"."}\n- **Pairings:** ${D.topPairs[0]?D.topPairs[0][0]+" are ordered together often. Offer them as a combo.":"not enough data yet."}\n- **Discounts:** ${D.discountedOrders} of ${D.orders} orders were discounted.`}
async function aiRun(){const el=$("ai"),D=aiData();if(!D.orders){el.textContent="No finished orders yet. Use Load sample data or complete some orders first.";return}
 el.textContent="Analyzing...";let sm=null;try{sm=window.claude?await claude.use("sample"):null}catch(e){}
 if(!sm){V.ai=localAI(D)+"\n\n(Built-in analysis. The AI service is not available here.)";el.innerHTML=md(V.ai);return}
 try{await sm("You are a restaurant analyst. Analyze this POS order history JSON (amounts in "+CUR+"). Give: 1) a two-sentence overview, 2) five specific insights (best sellers, slow items with margin, peak hours, voids, pairings, discounts), 3) five concrete actions for the owner. Be concise, plain text, use - bullets and **bold** labels.\n\n"+JSON.stringify(D),{modelTier:"default",cache:false,onText:({text})=>{V.ai=text;el.innerHTML=md(text)}})}
 catch(e){V.ai=localAI(D)+"\n\n(AI service unavailable. Showing built-in analysis.)";el.innerHTML=md(V.ai)}}
function demo(){const now=new Date();for(let d=0;d<30;d++)for(let k=0;k<2+Math.floor(Math.random()*6);k++){const it=[],n=2+Math.floor(Math.random()*4);
 for(let j=0;j<n;j++){const x=MENU[Math.floor(Math.random()*MENU.length)];it.push({id:x.id,n:x.n,p:x.p,c:x.c,st:x.st,q:1+Math.floor(Math.random()*2),s:1,done:1,v:0})}
 const t=new Date(now.getFullYear(),now.getMonth(),now.getDate()-d,12+k,10).getTime(),o={id:S.seq++,tables:[""+(1+k)],items:it,status:"paid",created:t,paidAt:t,method:k%2?"Card":"Cash"};
 const c=calc(o);Object.assign(o,{sub:c.sub,tax:c.tax,total:c.total,cost:c.cost,vd:0});S.orders.push(o)}S.exp=S.exp||[];["Rent","Staff","Utilities","Supplies"].forEach((c,i)=>S.exp.push({d:dk(new Date(now.getFullYear(),now.getMonth(),Math.min(3+i*2,now.getDate())||1)),c,a:[1200,2500,400,600][i]}));save();render()}
function station(){const s=V.stn,isB=V.role==="bar",tabs=`<button class="${V.fin?"":"on"}" onclick="go({fin:false})">Active</button><button class="${V.fin?"on":""}" onclick="go({fin:true})">Finished</button>`;
 const os=S.orders.map(o=>({o,it:o.items.map((i,x)=>({i,x})).filter(z=>z.i.st===s&&z.i.s&&(V.fin?(z.i.done&&!z.i.v):(!z.i.done&&!z.i.v)))})).filter(z=>z.it.length&&(V.fin||z.o.status==="open"||true));
 os.sort((a,b)=>V.fin?b.it[0].i.done-a.it[0].i.done:a.it[0].i.s-b.it[0].i.s);
 const cards=os.map(z=>`<div class="card tk"><div class="row"><b style="font-size:18px">${lab(z.o)}</b><span class="mut">${tm(z.it[0].i.s)}</span></div>
 ${z.it.map(q=>`<div class="line"><div class="row"><span style="font-size:18px"><b>${q.i.q}x</b> ${q.i.n}</span>${isB||!V.fin?"":""}${V.fin?`<span class="mut">done ${tm(q.i.done)}</span>`:`<button class="p" onclick="ready(${z.o.id},${q.x})">Ready</button>`}</div></div>`).join("")}</div>`).join("");
 const vd=!V.fin?S.orders.flatMap(o=>o.items.filter(i=>i.st===s&&i.v&&i.s&&!i.done&&Date.now()-i.vt<600000).map(i=>`<div class="card" style="border-color:var(--bad);color:var(--bad)">VOIDED: ${i.q}x ${i.n} (${lab(o)})</div>`)).join(""):"";
 return head(STN[s],tabs)+`<div class="wrap"><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${vd}${cards}</div>${cards||vd?"":`<div class="mut" style="padding:30px;text-align:center">${V.fin?"Nothing finished yet.":"No active tickets. New orders appear here when the counter sends them."}</div>`}</div>`}
function ready(oid,x){ord(oid).items[x].done=Date.now();save();render()}
setInterval(()=>{if(V.auth&&(V.role==="kitchen"||V.role==="bar")&&!V.modal){try{const x=localStorage.getItem(KEY());if(x&&x!==JSON.stringify(S)){S=JSON.parse(x);render()}}catch(e){}}},4000);
render();
</script></body></html>
